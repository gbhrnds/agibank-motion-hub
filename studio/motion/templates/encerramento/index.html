<!doctype html>
<html
  lang="pt-BR"
  data-composition-variables='[{"id":"frase","type":"string","label":"Frase de assinatura","default":"{{frase}}"},{"id":"cta","type":"string","label":"Chamada para ação (pode ficar vazia)","default":"{{cta}}"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <!-- Encerramento Agibank: fundo azul, logo negativo, frase em branco e CTA em módulo verde
         com texto azul-escuro. Opaco. -->
    <script src="assets/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/brand.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: __W__px; height: __H__px; overflow: hidden; background: var(--agi-azul); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--agi-font); }
      #bg { position: absolute; inset: 0; background: var(--agi-azul); }
      #enc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 56px; padding: 0 10%; text-align: center; }
      #enc-logo { width: 560px; }
      .portrait #enc-logo { width: 640px; }
      #enc-logo img { display: block; width: 100%; height: auto; }
      #enc-frase { color: var(--agi-branco); font-weight: 600; font-size: 64px; line-height: 1.15; letter-spacing: -0.01em; max-width: 1400px; }
      #enc-frase .w { display: inline-block; }
      #enc-cta-box { background: var(--agi-verde); border-radius: var(--agi-raio); padding: 18px 44px 22px; }
      #enc-cta { color: var(--agi-azul-escuro); font-weight: 700; font-size: 44px; line-height: 1.1; }
    </style>
  </head>
  <body class="__ORIENT__">
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="__W__" data-height="__H__">
      <div id="bg" class="clip" data-start="0" data-duration="__DUR__" data-track-index="0"></div>
      <div id="enc" class="clip" data-start="0" data-duration="__DUR__" data-track-index="1">
        <div id="enc-logo"><img src="assets/logos/Agibank_Negativo.svg" alt="Agibank" /></div>
        <p id="enc-frase" data-var-text="frase">{{frase}}</p>
        <div id="enc-cta-box"><div id="enc-cta" data-var-text="cta">{{cta}}</div></div>
      </div>
    </div>
    <script>
      const D = __DUR__;
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const fr = document.getElementById("enc-frase");
      fr.innerHTML = (vars.frase ?? fr.textContent).trim().split(/\s+/).map((w) => `<span class="w">${w.replace(/</g, "&lt;")}</span>`).join(" ");
      if (!(vars.cta ?? document.getElementById("enc-cta").textContent).trim()) document.getElementById("enc-cta-box").style.display = "none";

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#enc-logo img", { opacity: 0, scale: 0.9, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 0.15);
      tl.fromTo("#enc-frase .w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out", stagger: 0.07 }, 0.6);
      tl.fromTo("#enc-cta-box", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.4)" }, 1.3);
      // Última tela segura parada até o fim (mínimo 2 s de leitura).
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
