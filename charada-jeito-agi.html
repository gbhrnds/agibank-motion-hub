<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charada · O Jeito Agi</title>
<!--
  Charada - O Jeito Agi
  Motion interativo para o telão do Campus · 1920x1080 (16:9) · 24fps

  Assets do repositório:
  - Tipografia: assets/fonts/AgibankSans-*.woff2 (com fallback para a CDN do assets-map.md)
  - Cacos: assets/shapes/Ativo 1..40.svg (paths embutidos abaixo, pintados via código)
  - Logo agi: assets/logos/Agi_Positivo.svg (lockup "O jeito agi" montado em código)

  Atalhos: Espaço = play/pause · ← / → = cena anterior/próxima · 1-6 = ir para cena
           R = reiniciar · F = tela cheia · L = loop · H = pausar antes da revelação
-->
<style>
  @font-face { font-family: 'Agibank Sans'; font-weight: 400; font-display: block;
    src: url('assets/fonts/AgibankSans-Regular.woff2') format('woff2'),
         url('https://cdn.jsdelivr.net/gh/gbhrnds/agibank-motion-hub@main/assets/fonts/AgibankSans-Regular.woff2') format('woff2'); }
  @font-face { font-family: 'Agibank Sans'; font-weight: 500; font-display: block;
    src: url('assets/fonts/AgibankSans-Medium.woff2') format('woff2'),
         url('https://cdn.jsdelivr.net/gh/gbhrnds/agibank-motion-hub@main/assets/fonts/AgibankSans-Medium.woff2') format('woff2'); }
  @font-face { font-family: 'Agibank Sans'; font-weight: 600; font-display: block;
    src: url('assets/fonts/AgibankSans-SemiBold.woff2') format('woff2'),
         url('https://cdn.jsdelivr.net/gh/gbhrnds/agibank-motion-hub@main/assets/fonts/AgibankSans-SemiBold.woff2') format('woff2'); }
  @font-face { font-family: 'Agibank Sans'; font-weight: 700; font-display: block;
    src: url('assets/fonts/AgibankSans-Bold.woff2') format('woff2'),
         url('https://cdn.jsdelivr.net/gh/gbhrnds/agibank-motion-hub@main/assets/fonts/AgibankSans-Bold.woff2') format('woff2'); }

  :root {
    --cinza: #f3f3f3;
    --azul: #0064f5;
    --azul-medio: #0033b0;
    --azul-escuro: #000f44;
    --verde: #77df40;
    --amarelo: #ffd600;
    --ui-bg: #0b1433;
    --ui-panel: #131f4a;
    --ui-line: #24326a;
    --ui-text: #e8ecf8;
    --ui-muted: #93a0c8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--ui-bg);
    color: var(--ui-text);
    font-family: 'Agibank Sans', system-ui, sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Palco ---------- */
  #viewport {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 24px 12px;
    position: relative;
  }
  #stage-wrap { position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.45); border-radius: 14px; overflow: hidden; }
  #stage {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 1080px;
    transform-origin: 0 0;
    background: var(--cinza);
    overflow: hidden;
  }
  #cacos { position: absolute; inset: 0; width: 1920px; height: 1080px; }

  #logo {
    position: absolute; left: 50%; top: 64px;
    width: 340px; margin-left: -170px;
    will-change: transform, opacity;
  }
  #logo svg { display: block; width: 100%; height: auto; overflow: visible; }

  .pillar {
    position: absolute; left: 0; right: 0; top: 330px; height: 470px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 56px;
    visibility: hidden;
  }
  .hint {
    display: inline-flex; align-items: center; gap: 22px;
    background: #fff;
    border-radius: 16px;
    padding: 20px 34px 20px 26px;
    font-size: 34px; font-weight: 400; color: var(--azul-medio);
    box-shadow: 0 6px 24px rgba(0, 15, 68, .06);
    will-change: transform, opacity;
  }
  .hint .bar { width: 6px; height: 44px; border-radius: 3px; background: var(--azul); }
  .hint b { font-weight: 700; }

  .phrase {
    max-width: 1480px; margin: 0;
    text-align: center;
    font-size: 76px; line-height: 1.28; font-weight: 600;
    color: var(--azul-escuro);
    letter-spacing: -0.01em;
  }
  .w { display: inline-block; will-change: transform, opacity; }
  .nb { white-space: nowrap; display: inline-block; }
  .pont { margin-left: -.02em; }
  .slot {
    position: relative; display: inline-block;
    padding: 0 .24em; margin: 0 .04em;
    vertical-align: baseline;
  }
  .slot .pill {
    position: absolute; left: 0; right: 0; top: .1em; bottom: .02em;
    border-radius: 14px;
    transform-origin: 0 50%;
  }
  .slot .ans { position: relative; display: inline-block; font-weight: 700; }
  .slot .line {
    position: absolute; left: .24em; right: .24em; bottom: .04em;
    height: 7px; border-radius: 4px; background: var(--azul);
    transform-origin: 0 50%;
  }
  .slot .q {
    position: absolute; left: 0; right: 0; top: 0; text-align: center;
    color: var(--azul); font-weight: 700;
  }

  /* ---------- Controles ---------- */
  #controls {
    padding: 10px 24px 18px;
    display: flex; flex-direction: column; gap: 12px;
    user-select: none;
  }
  #progress {
    position: relative; height: 34px; cursor: pointer;
    display: flex; align-items: center;
    touch-action: none;
  }
  #segments { position: absolute; left: 0; right: 0; height: 10px; display: flex; gap: 3px; }
  .seg { position: relative; height: 100%; border-radius: 5px; background: var(--ui-line); overflow: hidden; }
  .seg .fill { position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(0); }
  #playhead {
    position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px;
    border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,.18);
    pointer-events: none;
  }
  #progress:hover #playhead { box-shadow: 0 0 0 7px rgba(255,255,255,.22); }

  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .btn {
    appearance: none; border: 1px solid var(--ui-line); background: var(--ui-panel);
    color: var(--ui-text); font: inherit; font-size: 15px; font-weight: 500;
    height: 42px; min-width: 42px; padding: 0 14px; border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    cursor: pointer;
  }
  .btn:hover { border-color: #3a4c93; }
  .btn:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }
  .btn.primary { background: var(--azul); border-color: var(--azul); color: #fff; min-width: 112px; }
  .btn svg { width: 18px; height: 18px; fill: currentColor; }
  .btn[aria-pressed="true"] { border-color: var(--azul); background: #12307a; }
  #timecode { font-variant-numeric: tabular-nums; font-size: 15px; color: var(--ui-muted); min-width: 220px; }
  #timecode b { color: var(--ui-text); font-weight: 600; }
  .spacer { flex: 1; }
  #scenes { display: flex; gap: 8px; flex-wrap: wrap; }
  .scene-btn {
    appearance: none; font: inherit; cursor: pointer;
    background: var(--ui-panel); color: var(--ui-text);
    border: 1px solid var(--ui-line); border-radius: 12px;
    height: 42px; padding: 0 14px 0 10px;
    display: inline-flex; align-items: center; gap: 10px; font-size: 14px;
  }
  .scene-btn .dot { width: 6px; height: 22px; border-radius: 3px; }
  .scene-btn .num { font-weight: 700; }
  .scene-btn .lbl { color: var(--ui-muted); }
  .scene-btn.active { border-color: #fff; }
  .scene-btn.active .lbl { color: var(--ui-text); }
  .scene-btn:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }

  #loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--azul-medio); font-size: 28px; background: var(--cinza);
  }

  /* Tela cheia: só o palco, controles aparecem ao mexer o mouse */
  body.fs #viewport { padding: 0; }
  body.fs #stage-wrap { border-radius: 0; box-shadow: none; }
  body.fs #controls {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: linear-gradient(transparent, rgba(11,20,51,.92) 40%);
    padding-top: 40px;
    transition: opacity .3s;
  }
  body.fs.idle #controls { opacity: 0; pointer-events: none; }
  body.fs.idle { cursor: none; }

  /* ?render=1: só o palco em 1920x1080, usado por tools/render-mp4.js */
  body.render #controls { display: none; }
  body.render #viewport { padding: 0; }
  body.render #stage-wrap { border-radius: 0; box-shadow: none; }

  @media (max-width: 900px) {
    #controls { padding: 8px 12px 14px; }
    .scene-btn .lbl { display: none; }
    #timecode { min-width: 0; }
  }
</style>

/* ===================== Roteiro ===================== */
const FPS = 24;
const W = 1920, H = 1080;
const COR = { cinza: '#f3f3f3', azul: '#0064f5', azulMedio: '#0033b0', azulEscuro: '#000f44', verde: '#77df40', amarelo: '#ffd600' };

const PILARES = [
  { nome: 'Viver pelo cliente',     cor: COR.azulMedio, tinta: '#ffffff',
    antes: 'O Agibank só existe se conseguir resolver', resposta: 'as dores', depois: 'dos seus clientes' },
  { nome: 'Agir como empreendedor', cor: COR.verde,     tinta: COR.azulEscuro,
    antes: 'Nos destacamos no mercado por', resposta: 'excelência e inovação', depois: '.' },
  { nome: 'Crescer na jornada',     cor: COR.amarelo,   tinta: COR.azulEscuro,
    antes: 'O Agibank é para aquelas pessoas que vivem em busca de', resposta: 'novos conhecimentos', depois: '.' },
];

// Cenas 01-06: charada (cacos azuis) seguida da revelação (cacos na cor do pilar)
const DUR_CHARADA = 9, DUR_REVELA = 7, OUTRO = 0.8;
const CENAS = [];
{
  let t = 0;
  PILARES.forEach((p, i) => {
    CENAS.push({ tipo: 'charada', pilar: i, inicio: t, dur: DUR_CHARADA, cor: COR.azul,
                 rotulo: 'Charada · ' + p.nome });
    t += DUR_CHARADA;
    const dur = DUR_REVELA + (i === PILARES.length - 1 ? OUTRO + 0.5 : 0);
    CENAS.push({ tipo: 'revela', pilar: i, inicio: t, dur, cor: p.cor, rotulo: 'Revelação · ' + p.nome });
    t += dur;
  });
}
const TOTAL = CENAS[CENAS.length - 1].inicio + CENAS[CENAS.length - 1].dur;
const TOTAL_FRAMES = Math.round(TOTAL * FPS);

/* ===================== Utilitários ===================== */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, d) => clamp((t - a) / d);
const lerp = (a, b, k) => a + (b - a) * k;
const easeOutCubic = k => 1 - Math.pow(1 - k, 3);
const easeInCubic = k => k * k * k;
const easeInOutCubic = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOutBack = k => { const c1 = 1.55, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function rng(seed) { // mulberry32
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let r = Math.imul(seed ^ seed >>> 15, 1 | seed);
    r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; };
}
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

/* ===================== Cacos ===================== */
// Posições nas bordas do palco: nunca sobre textos nem na área de reserva do logo
const SLOTS = [
  [150, 170, 230], [420, 100, 130], [575, 255, 92],  [1350, 255, 104], [1500, 105, 145], [1770, 180, 220],
  [92, 545, 150],  [1832, 560, 160],
  [175, 905, 240], [480, 990, 140], [770, 915, 104], [1150, 975, 124], [1445, 905, 176], [1765, 935, 230],
];
const PATHS = SHAPES.map(s => new Path2D(s.d));
const CENTRO = [W / 2, 560];

// Cada cena tem seu próprio conjunto de cacos (formas, giros e espelhamentos diferentes)
const CONJUNTOS = CENAS.map((cena, i) => {
  const r = rng(1009 * (i + 3));
  const ordem = SHAPES.map((_, k) => k).sort(() => r() - .5);
  const entrada = i === 0 ? 0.6 : cena.inicio + 0.22;
  const saida = i === CENAS.length - 1 ? TOTAL - OUTRO : cena.inicio + cena.dur;
  const pecas = SLOTS.map(([x, y, tam], k) => {
    const sh = SHAPES[ordem[k]];
    const dx = x - CENTRO[0], dy = y - CENTRO[1], dl = Math.hypot(dx, dy) || 1;
    return {
      shape: ordem[k], x, y,
      escala: tam * (0.88 + r() * 0.2) / Math.max(sh.w, sh.h),
      rot: r() * Math.PI * 2,
      flip: r() < .5 ? -1 : 1,
      dir: [dx / dl, dy / dl],
      fase: [r() * 6.28, r() * 6.28, r() * 6.28],
      atraso: (k / SLOTS.length) * 0.45 + r() * 0.12,
      saidaAtraso: r() * 0.12,
    };
  });
  return { cor: cena.cor, entrada, saida, pecas };
});

const ctx = document.getElementById('cacos').getContext('2d');
function desenharCacos(t) {
  ctx.clearRect(0, 0, W, H);
  for (const conj of CONJUNTOS) {
    if (t < conj.entrada || t > conj.saida + 0.7) continue;
    ctx.fillStyle = conj.cor;
    for (const p of conj.pecas) {
      const pe = prog(t, conj.entrada + p.atraso, 0.75);
      if (pe <= 0) continue;
      const ps = prog(t, conj.saida + p.saidaAtraso, 0.38); // saída rápida
      if (ps >= 1) continue;
      const ein = easeOutCubic(pe), eout = easeInCubic(ps);
      let s = easeOutBack(pe) * (1 - eout);
      const desloc = 140 * (1 - ein) + 260 * eout;
      // flutuação contínua
      const fx = 11 * Math.sin(t * 0.62 + p.fase[0]);
      const fy = 13 * Math.sin(t * 0.47 + p.fase[1]);
      const fr = 0.11 * Math.sin(t * 0.33 + p.fase[2]);
      const rot = p.rot + fr - (1 - ein) * 0.9 + eout * 1.4;
      const sh = SHAPES[p.shape];
      ctx.save();
      ctx.globalAlpha = clamp(pe * 3) * (1 - ps * 0.6);
      ctx.translate(p.x + p.dir[0] * desloc + fx, p.y + p.dir[1] * desloc + fy);
      ctx.rotate(rot);
      ctx.scale(p.escala * s * p.flip, p.escala * s);
      ctx.translate(-sh.w / 2, -sh.h / 2);
      ctx.fill(PATHS[p.shape]);
      ctx.restore();
    }
  }
}

/* ===================== Textos ===================== */
const pillarsEl = document.getElementById('pillars');
const BLOCOS = PILARES.map((p, i) => {
  const el = document.createElement('div');
  el.className = 'pillar';
  const palavras = p.antes.split(' ');
  const depoisPont = /^[.,!?;:]/.test(p.depois);
  const depois = depoisPont ? [] : p.depois.split(' ');
  el.innerHTML = `
    <div class="hint"><span class="bar"></span><span>Dica: está relacionado ao pilar <b>${p.nome}</b></span></div>
    <p class="phrase">${palavras.map(w => `<span class="w">${w}</span>`).join(' ')}
      <span class="nb"><span class="slot w">
        <span class="pill" style="background:${p.cor}"></span>
        <span class="line"></span>
        <span class="q">?</span>
        <span class="ans" style="color:${p.tinta}">${p.resposta}</span>
      </span>${depoisPont ? `<span class="w pont">${p.depois}</span>` : ''}</span>
      ${depois.map(w => `<span class="w">${w}</span>`).join(' ')}</p>`;
  pillarsEl.appendChild(el);
  const ws = [...el.querySelectorAll('.phrase > .w, .phrase > .nb > .w')];
  return {
    el, hint: el.querySelector('.hint'), bar: el.querySelector('.bar'),
    palavras: ws, slot: el.querySelector('.slot'),
    pill: el.querySelector('.pill'), line: el.querySelector('.line'),
    q: el.querySelector('.q'), ans: el.querySelector('.ans'),
    charada: CENAS[i * 2], revela: CENAS[i * 2 + 1],
  };
});

function mixHex(a, b, k) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`;
}

function desenharTextos(t) {
  BLOCOS.forEach((b, i) => {
    const t0 = b.charada.inicio;
    const tr = b.revela.inicio;
    const fim = i === BLOCOS.length - 1 ? TOTAL - OUTRO : b.revela.inicio + b.revela.dur;
    const u = t - t0;
    const visivel = t >= t0 + 0.3 && t < fim + 0.05;
    b.el.style.visibility = visivel ? 'visible' : 'hidden';
    if (!visivel) return;

    // saída antes da próxima charada
    const sai = easeInCubic(prog(t, fim - 0.6, 0.55));

    // dica
    const ph = easeOutCubic(prog(u, 0.45, 0.7));
    b.hint.style.opacity = ph * (1 - sai);
    b.hint.style.transform = `translateY(${(1 - ph) * 30 - sai * 20}px)`;
    b.bar.style.background = mixHex(COR.azul, PILARES[i].cor, easeInOutCubic(prog(t, tr + 0.3, 0.5)));

    // frase incompleta: palavras em cascata
    b.palavras.forEach((w, k) => {
      const pw = easeOutCubic(prog(u, 1.2 + k * 0.075, 0.6));
      const ps = easeInCubic(prog(t, fim - 0.6 + k * 0.012, 0.45));
      w.style.opacity = pw * (1 - ps);
      w.style.transform = `translateY(${(1 - pw) * 46 - ps * 34}px)`;
    });

    // lacuna: traço desenhado + "?" pulsando
    const nPal = b.palavras.length;
    const tLinha = 1.2 + nPal * 0.075 + 0.1;
    const pl = easeInOutCubic(prog(u, tLinha, 0.55));
    const someLacuna = easeInCubic(prog(t, tr + 0.1, 0.35));
    b.line.style.transform = `scaleX(${pl})`;
    b.line.style.opacity = 1 - someLacuna;
    const pq = easeOutBack(prog(u, tLinha + 0.35, 0.5));
    const pulso = t < tr ? 1 + 0.06 * Math.sin((u - tLinha) * 4.2) : 1;
    b.q.style.opacity = clamp(pq) * (1 - someLacuna);
    b.q.style.transform = `scale(${Math.max(0, pq) * pulso}) translateY(${someLacuna * -16}px)`;

    // revelação: faixa na cor do pilar abre e a resposta entra em fade
    const pp = easeInOutCubic(prog(t, tr + 0.35, 0.5));
    b.pill.style.transform = `scaleX(${pp})`;
    b.pill.style.opacity = pp > 0 ? 1 : 0;
    const pa = easeOutCubic(prog(t, tr + 0.7, 0.75));
    b.ans.style.opacity = pa;
    b.ans.style.transform = `translateY(${(1 - pa) * 10}px)`;
    const pop = Math.sin(prog(t, tr + 0.35, 0.9) * Math.PI) * 0.035;
    b.slot.style.transform = `scale(${1 + pop})`;
  });
}

/* ===================== Logo ===================== */
const logo = document.getElementById('logo');
const logoDot = document.getElementById('logo-dot');
logoDot.style.transformBox = 'fill-box';
logoDot.style.transformOrigin = 'center';
function desenharLogo(t) {
  const p = easeOutCubic(prog(t, 0.1, 0.8));
  logo.style.opacity = p;
  logo.style.transform = `translateY(${(1 - p) * -28}px)`;
  logoDot.style.transform = `scale(${Math.max(0, easeOutBack(prog(t, 0.55, 0.6)))})`;
}

/* ===================== Render ===================== */
function render(frame) {
  const t = frame / FPS;
  desenharCacos(t);
  desenharLogo(t);
  desenharTextos(t);
  atualizarUI(frame);
}

/* ===================== Player ===================== */
const estado = { frame: 0, tocando: false, loop: true, segurar: false, t0: 0, f0: 0, ultimo: -1 };
const cenaDoFrame = f => { const t = f / FPS; let c = 0; CENAS.forEach((s, i) => { if (t >= s.inicio - 1e-6) c = i; }); return c; };
const frameDaCena = i => Math.round(CENAS[i].inicio * FPS);

function tocar() {
  if (estado.frame >= TOTAL_FRAMES - 1) estado.frame = 0;
  estado.tocando = true; estado.t0 = performance.now(); estado.f0 = estado.frame;
  atualizarBotao();
}
function pausar() { estado.tocando = false; atualizarBotao(); }
function irPara(frame, manterTocando = estado.tocando) {
  estado.frame = clamp(Math.round(frame), 0, TOTAL_FRAMES - 1);
  estado.t0 = performance.now(); estado.f0 = estado.frame;
  estado.tocando = manterTocando;
  estado.ultimo = -1;
  atualizarBotao();
}
function irParaCena(i) { irPara(frameDaCena(clamp(i, 0, CENAS.length - 1))); }

function loop(now) {
  if (estado.tocando) {
    let f = estado.f0 + Math.floor((now - estado.t0) / 1000 * FPS);
    // pausa automática no último frame de cada charada (o próximo play segue para a revelação)
    if (estado.segurar) {
      for (let i = 1; i < CENAS.length; i += 2) {
        const limite = frameDaCena(i) - 1;
        if (estado.frame < limite && f >= limite) { f = limite; estado.frame = f; pausar(); break; }
      }
    }
    if (estado.tocando) {
      if (f >= TOTAL_FRAMES) {
        if (estado.loop) { f = 0; estado.t0 = now; estado.f0 = 0; }
        else { f = TOTAL_FRAMES - 1; pausar(); }
      }
      estado.frame = f;
    }
  }
  if (estado.frame !== estado.ultimo) { estado.ultimo = estado.frame; render(estado.frame); }
  requestAnimationFrame(loop);
}

/* ===================== UI ===================== */
const $ = id => document.getElementById(id);
const segs = $('segments');
const SEG_ELS = CENAS.map((c, i) => {
  const s = document.createElement('div');
  s.className = 'seg'; s.style.flex = String(c.dur);
  s.title = `${String(i + 1).padStart(2, '0')} · ${c.rotulo}`;
  s.innerHTML = `<div class="fill" style="background:${c.cor}"></div>`;
  segs.appendChild(s);
  return s.firstChild;
});
const CENA_BTNS = CENAS.map((c, i) => {
  const b = document.createElement('button');
  b.className = 'scene-btn';
  b.innerHTML = `<span class="dot" style="background:${c.cor}"></span><span class="num">${String(i + 1).padStart(2, '0')}</span><span class="lbl">${c.rotulo}</span>`;
  b.onclick = () => irParaCena(i);
  $('scenes').appendChild(b);
  return b;
});

function tc(f) {
  const s = Math.floor(f / FPS), fr = f % FPS;
  return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}:${String(fr).padStart(2, '0')}`;
}
function atualizarUI(frame) {
  const t = frame / FPS, c = cenaDoFrame(frame);
  CENAS.forEach((s, i) => SEG_ELS[i].style.transform = `scaleX(${clamp((t - s.inicio) / s.dur)})`);
  const bar = $('progress').getBoundingClientRect();
  // posição do playhead respeitando os espaços entre segmentos
  const seg = SEG_ELS[c].parentElement, sr = seg.getBoundingClientRect();
  const k = clamp((t - CENAS[c].inicio) / CENAS[c].dur);
  $('playhead').style.left = (sr.left - bar.left + sr.width * k) + 'px';
  $('progress').setAttribute('aria-valuemax', TOTAL_FRAMES - 1);
  $('progress').setAttribute('aria-valuenow', frame);
  $('timecode').innerHTML = `<b>${tc(frame)}</b> / ${tc(TOTAL_FRAMES)} · Cena ${String(c + 1).padStart(2, '0')} · ${FPS}fps`;
  CENA_BTNS.forEach((b, i) => b.classList.toggle('active', i === c));
}
function atualizarBotao() {
  $('play-label').textContent = estado.tocando ? 'Pause' : 'Play';
  $('ico-play').innerHTML = estado.tocando ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
}
const alternar = () => estado.tocando ? pausar() : tocar();
$('btn-play').onclick = alternar;
$('btn-restart').onclick = () => irPara(0, true);
$('btn-prev').onclick = () => {
  const c = cenaDoFrame(estado.frame);
  // se já passou do início da cena, volta ao começo dela; senão, cena anterior
  irParaCena(estado.frame - frameDaCena(c) > FPS * 0.5 ? c : c - 1);
};
$('btn-next').onclick = () => {
  const c = cenaDoFrame(estado.frame);
  if (c < CENAS.length - 1) irParaCena(c + 1); else irPara(TOTAL_FRAMES - 1, false);
};
function toggleBtn(id, chave) {
  estado[chave] = !estado[chave];
  $(id).setAttribute('aria-pressed', String(estado[chave]));
}
$('btn-loop').onclick = () => toggleBtn('btn-loop', 'loop');
$('btn-hold').onclick = () => toggleBtn('btn-hold', 'segurar');
$('btn-fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
document.addEventListener('fullscreenchange', () => { document.body.classList.toggle('fs', !!document.fullscreenElement); ajustar(); });

// barra de progresso: clique e arraste
const prg = $('progress');
function frameDoPonteiro(x) {
  for (let i = 0; i < CENAS.length; i++) {
    const r = SEG_ELS[i].parentElement.getBoundingClientRect();
    if (x <= r.right + 1.5 || i === CENAS.length - 1)
      return (CENAS[i].inicio + clamp((x - r.left) / r.width) * CENAS[i].dur) * FPS;
  }
}
let arrastando = false, tocavaAntes = false;
prg.addEventListener('pointerdown', e => {
  arrastando = true; tocavaAntes = estado.tocando; prg.setPointerCapture(e.pointerId);
  irPara(frameDoPonteiro(e.clientX), false);
});
prg.addEventListener('pointermove', e => { if (arrastando) irPara(frameDoPonteiro(e.clientX), false); });
prg.addEventListener('pointerup', () => { if (arrastando) { arrastando = false; if (tocavaAntes) tocar(); } });
prg.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault(); e.stopPropagation();
    irPara(estado.frame + (e.key === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? FPS : 1), false);
  }
});

document.addEventListener('keydown', e => {
  if (e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) {
    if (e.key === ' ') e.preventDefault(); else return;
  }
  const k = e.key.toLowerCase();
  if (e.key === ' ') { e.preventDefault(); alternar(); }
  else if (e.key === 'ArrowRight') $('btn-next').click();
  else if (e.key === 'ArrowLeft') $('btn-prev').click();
  else if (k === 'r') irPara(0, true);
  else if (k === 'f') $('btn-fs').click();
  else if (k === 'l') $('btn-loop').click();
  else if (k === 'h') $('btn-hold').click();
  else if (/^[1-6]$/.test(e.key)) irParaCena(+e.key - 1);
});

// controles somem em tela cheia quando o mouse fica parado
let idleTimer;
document.addEventListener('pointermove', () => {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('idle'), 2200);
});

// palco 1920x1080 escalado para caber na janela
function ajustar() {
  const vp = $('viewport'), cs = getComputedStyle(vp);
  const aw = vp.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = vp.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const s = Math.min(aw / W, ah / H);
  $('stage').style.transform = `scale(${s})`;
  $('stage-wrap').style.width = W * s + 'px';
  $('stage-wrap').style.height = H * s + 'px';
  estado.ultimo = -1;
}
window.addEventListener('resize', ajustar);

// ?t=12.5 abre num instante específico; ?cena=3 abre numa cena; ?autoplay=1 começa tocando
// ?render=1 esconde os controles e expõe window.renderFrame(f) para exportar o MP4
async function iniciar() {
  const q = new URLSearchParams(location.search);
  if (q.get('render') === '1') document.body.classList.add('render');
  ajustar();
  try { await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 4000))]);
        await Promise.all([400, 500, 600, 700].map(w => document.fonts.load(`${w} 40px "Agibank Sans"`))); } catch (e) {}
  $('loading').remove();
  if (q.get('render') === '1') {
    window.TOTAL_FRAMES = TOTAL_FRAMES; window.FPS = FPS;
    window.renderFrame = f => render(f);
    window.pronto = true;
    return;
  }
  if (q.has('t')) irPara(parseFloat(q.get('t')) * FPS, false);
  else if (q.has('cena')) irParaCena(parseInt(q.get('cena'), 10) - 1);
  if (q.get('autoplay') === '1') tocar();
  atualizarBotao();
  requestAnimationFrame(loop);
}
iniciar();
</script>
</body>
</html>
